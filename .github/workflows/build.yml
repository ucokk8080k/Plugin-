name: Build EventX
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: unzip -q EventX-source.zip
      - run: mvn -B package -f EventX/pom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: EventX
          path: EventX/target/EventX.jar
